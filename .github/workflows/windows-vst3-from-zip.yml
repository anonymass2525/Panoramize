name: Panoramize 5.4 - Windows VST3 from source ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out repository containing source ZIP
        uses: actions/checkout@v4

      - name: Expand source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'Panoramize_v5.4.0_MSVC_Fix1_Source.zip'
          if (-not (Test-Path -LiteralPath $zip)) { throw "Missing source archive: $zip" }
          Expand-Archive -LiteralPath $zip -DestinationPath 'source' -Force
          $project = (Resolve-Path 'source/Panoramize_v5.4.0').Path
          if (-not (Test-Path (Join-Path $project 'CMakeLists.txt'))) { throw 'CMakeLists.txt missing in source ZIP' }
          # Release builds define NDEBUG. Several existing test programs use assert(expr)
          # for setup, so disabling assert() removes necessary operations and can crash.
          # Restore assert() ONLY in test executables, not in the production DSP/VST3.
          $cmakeFile = Join-Path $project 'CMakeLists.txt'
          $testAssertions = @'
          # Windows CI: keep test-side assert() active in optimized Release builds.
          if(MSVC)
            get_property(_panoramize_ci_targets DIRECTORY PROPERTY BUILDSYSTEM_TARGETS)
            foreach(_ci_target IN LISTS _panoramize_ci_targets)
              if(_ci_target MATCHES "(_test|_smoke)$")
                get_target_property(_ci_type "${_ci_target}" TYPE)
                if(_ci_type STREQUAL "EXECUTABLE")
                  target_compile_options("${_ci_target}" PRIVATE "$<$<CONFIG:Release>:/UNDEBUG>")
                  # Synth is ~883 KiB; legacy tests create several Synth/Processor
                  # locals in a single main() stack frame. Windows default 1 MiB
                  # stack causes 0xC00000FD (stack overflow) before assertions.
                  # Only test executables get a larger stack; VST3 is unchanged.
                  target_link_options("${_ci_target}" PRIVATE "/STACK:67108864")
                endif()
              endif()
            endforeach()
          endif()
          '@
          Add-Content -LiteralPath $cmakeFile -Value $testAssertions -Encoding utf8
          "PANORAMA_SRC=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows x64 VST3, run CTest and pluginval strictness 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:PANORAMA_SRC 'ci/Build-Test-Windows54.ps1') -InstallScope None
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect VST3 and diagnostic logs even if validation failed
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Path 'artifact' -ItemType Directory -Force | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:PANORAMA_SRC)) { exit 0 }
          $vst3Root = Join-Path $env:PANORAMA_SRC 'build-win/Panoramize_Plugin_artefacts/Release/VST3'
          if (Test-Path $vst3Root) {
            $bundles = @(Get-ChildItem -Path $vst3Root -Directory -Filter '*.vst3')
            if ($bundles.Count -gt 0) {
              New-Item -Path 'artifact/VST3' -ItemType Directory -Force | Out-Null
              foreach ($bundle in $bundles) {
                Copy-Item -LiteralPath $bundle.FullName -Destination 'artifact/VST3' -Recurse -Force
              }
              'BUILD PRODUCED VST3; check acceptance54.json before treating as validated.' |
                Set-Content 'artifact/VALIDATION_STATUS.txt'
            }
          }
          $logs = Join-Path $env:PANORAMA_SRC 'windows-validation54'
          if (Test-Path $logs) { Copy-Item -LiteralPath $logs -Destination 'artifact' -Recurse -Force }
          $testing = Join-Path $env:PANORAMA_SRC 'build-win/Testing'
          if (Test-Path $testing) { Copy-Item -LiteralPath $testing -Destination 'artifact' -Recurse -Force }

      - name: Upload VST3 and validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Panoramize-v5.4-Windows-x64-build-results
          path: artifact/
          if-no-files-found: warn
          retention-days: 90
